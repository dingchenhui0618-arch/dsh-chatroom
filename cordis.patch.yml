# dsh-chatroom bundle patch：把本插件插进 profile 的层栈。
#
# 两半都干实事，缺一不可：
#   - Host 半边（lib/index.js）持有房间状态、Bot 回合与 /api/dsh.chatroom/* 路由；
#   - Client 半边（lib/client.js）注册侧栏入口、主面板、会话内的悬浮窗与未读提醒。
#
# 因此这里只有一行 insert：两个半边都由同一个包名解析，
# Client 半边由 clientModules 按 package.json 的 dsh.client 扫描后注入页面。
- insert:
    - id: dsh-chatroom
      name: dsh-chatroom
