<!doctype html>
<html lang="zh-CN" data-view="panel">
<head>
<meta charset="utf-8" />
<title>聊天室 · 渲染验收</title>
<style>
  /* 外壳只做两件事：提供 DSH 的暗色底与布局骨架，让插件面板落在真实尺寸里。
     取值照 DSH 默认深色主题的真实 token（bg-base #151517 / label-primary #f9fafb /
     label-secondary #cfd3d6 / brand-primary #f9fafb / border-l1 #ffffff0f / bg-layer-2 #2c2c2e），
     并原样把 --dsw-alias-* 摆出来 —— 这样截图里插件走的就是宿主那一套颜色，
     不是「取不到宿主 token 时的回退色」。 */
  :root {
    --bg: #151517;
    --surface: #18181a;
    --surface-2: #2c2c2e;
    --border: #ffffff0f;
    --text: #f9fafb;
    --muted: #81858c;
    --accent: #f9fafb;

    --dsw-alias-label-primary: #f9fafb;
    --dsw-alias-label-secondary: #cfd3d6;
    --dsw-alias-border-l1: #ffffff0f;
    --dsw-alias-bg-base: #151517;
    --dsw-alias-bg-layer-2: #2c2c2e;
    --dsw-alias-brand-primary: #f9fafb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; }

  /* 左侧图标栏 */
  .rail {
    width: 56px;
    flex: 0 0 56px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 8px;
    gap: 8px;
    /* 钉进自己的一层：不这样的话这块圆角图标在两次截图之间会落在半像素上，
       抗锯齿边缘差 1–6/255，重跑比对就不是逐字节相同了（实测踩过）。 */
    transform: translateZ(0);
  }
  .mark {
    display: block;
    width: 28px;
    height: 28px;
    border-radius: 9px;
    overflow: hidden;
  }
  .rail-nav { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  /* 插件自己往侧栏画的那颗图标也钉一层：它是内联 SVG，落在半像素上时描边边缘
     会差几级灰度（实测 guest 那张有 4 个像素、峰值 37/255）。 */
  #root-nav { transform: translateZ(0); }

  /* 主区 */
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .stage-panel { height: 100%; min-height: 0; }
  .stage-panel > #root-panel { height: 100%; min-height: 0; }

  /* 会话视图（替身）：只为说明悬浮窗与标题栏开关挂在哪 */
  .stage-session { display: none; flex-direction: column; height: 100%; min-height: 0; }
  html[data-view="session"] .stage-panel { display: none; }
  html[data-view="session"] .stage-session { display: flex; }

  .conv-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    min-height: 44px;
  }
  .conv-title { font-size: 14px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-body { flex: 1; min-height: 0; overflow: hidden; padding: 16px 24px; display: flex; flex-direction: column; gap: 16px; }
  .conv-msg { display: flex; gap: 12px; align-items: flex-start; max-width: 760px; }
  .conv-avatar {
    width: 24px; height: 24px; border-radius: 8px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;
    background: color-mix(in srgb, currentColor 10%, transparent);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .conv-msg-body { min-width: 0; }
  .conv-msg-meta { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .conv-msg-name { font-size: 12px; font-weight: 500; }
  .conv-msg-time { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .conv-msg-text { font-size: 13px; line-height: 1.7; color: color-mix(in srgb, var(--text) 86%, transparent); }
  .conv-composer { border-top: 1px solid var(--border); padding: 12px 24px 16px; }
  .conv-input {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--muted);
    background: color-mix(in srgb, #000 12%, transparent);
  }
  .conv-note { font-size: 11px; color: var(--muted); padding: 0 24px 12px; }
</style>
</head>
